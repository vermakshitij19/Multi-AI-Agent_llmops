apiVersion: v1
kind: Pod
metadata:
  name: db-copy
  namespace: multi-ai-agent
spec:
  containers:
    - name: db-copy
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: evaluation-data
          mountPath: /data
  volumes:
    - name: evaluation-data
      persistentVolumeClaim:
        claimName: multi-ai-agent-data-pvc
  restartPolicy: Never
