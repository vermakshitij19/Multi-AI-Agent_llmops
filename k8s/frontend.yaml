apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-ai-agent-frontend
  namespace: multi-ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-ai-agent-frontend
  template:
    metadata:
      labels:
        app: multi-ai-agent-frontend
    spec:
      containers:
        - name: frontend
          image: us-east1-docker.pkg.dev/devops-504813/multi-ai-agent/frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8502
          env:
            - name: BACKEND_URL
              value: "http://multi-ai-agent-backend:9999"
          readinessProbe:
            httpGet:
              path: /
              port: 8502
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8502
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: multi-ai-agent-frontend
  namespace: multi-ai-agent
spec:
  type: ClusterIP
  selector:
    app: multi-ai-agent-frontend
  ports:
    - port: 8502
      targetPort: 8502
