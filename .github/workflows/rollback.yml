
name: Multi AI Agent - Manual Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select application to roll back"
        required: true
        type: choice
        options:
          - all
          - backend
          - frontend
          - dashboard

permissions:
  contents: read
  id-token: write

# Prevent simultaneous rollback operations
concurrency:
  group: multi-ai-agent-gke-rollback
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback GKE Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Connect to GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: multi-ai-agent-dev-gke
          location: us-east1
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Rollback selected deployment
        env:
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail

          rollback_deployment() {
            local deployment="$1"

            echo "Rolling back: ${deployment}"

            kubectl rollout undo \
              "deployment/${deployment}" \
              -n multi-ai-agent

            kubectl rollout status \
              "deployment/${deployment}" \
              -n multi-ai-agent \
              --timeout=300s

            echo "Rollback successful: ${deployment}"
          }

          case "$TARGET" in
            backend)
              rollback_deployment multi-ai-agent-backend
              ;;
            frontend)
              rollback_deployment multi-ai-agent-frontend
              ;;
            dashboard)
              rollback_deployment multi-ai-agent-dashboard
              ;;
            all)
              rollback_deployment multi-ai-agent-backend
              rollback_deployment multi-ai-agent-frontend
              rollback_deployment multi-ai-agent-dashboard
              ;;
            *)
              echo "Invalid rollback target: $TARGET"
              exit 1
              ;;
          esac

      - name: Display current deployment images
        run: |
          kubectl get deployments -n multi-ai-agent \
            -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,READY:.status.readyReplicas
