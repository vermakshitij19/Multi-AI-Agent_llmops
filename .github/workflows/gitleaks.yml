
name: DevSecOps - Security Scanning

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # Security Gate 1: Secret Detection
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Security Gate 2: Python Dependency Scanning
  dependency-audit:
    name: Python Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Scan Python dependencies
        continue-on-error: true
        run: |
          pip-audit -r requirements-docker.txt

    
  # Security Gate 3: Python SAST
  bandit-sast:
    name: Python Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Scan Python source code
        continue-on-error: true
        run: |
          bandit -r app/ -ll -f screen

  
  # Security Gate 4: Dockerfile Scanning
  hadolint:
    name: Dockerfile Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Hadolint
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            hadolint/hadolint:v2.12.0 \
            Dockerfile.backend \
            Dockerfile.frontend \
            Dockerfile.dashboard
 
  # Security Gate 5: Container Image Scanning
  trivy-scan:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Backend Image
        run: |
          docker build \
            -f Dockerfile.backend \
            -t multi-ai-agent-backend:ci .

      - name: Build Frontend Image
        run: |
          docker build \
            -f Dockerfile.frontend \
            -t multi-ai-agent-frontend:ci .

      - name: Build Dashboard Image
        run: |
          docker build \
            -f Dockerfile.dashboard \
            -t multi-ai-agent-dashboard:ci .

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: multi-ai-agent-backend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: multi-ai-agent-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan Dashboard Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: multi-ai-agent-dashboard:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  
  # Security Gate 6: Terraform / IaC Scanning
  checkov-iac:
    name: Terraform Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v5

      - name: Check Terraform directory
        run: |
          echo "Terraform infrastructure is maintained in a separate repository."
          echo "Checkov scanning will be enabled when infrastructure code is integrated."

  
  # Application Gate: Automated Unit Tests
  unit-tests:
    name: Application Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt

      - name: Test input guardrails
        run: |
          python scripts/test_guardrails.py

      - name: Test output guardrails
        run: |
          python scripts/test_output_guardrails.py




